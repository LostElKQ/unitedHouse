services:
  db:
    image: postgres:18.6-trixie
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - united_house_net

  app:
    image: united_house:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_HOST: db
      DATABASE_URL: postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@db/${DATABASE_NAME}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ORIGIN: https://localhost
    restart: always

    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.31.8-alpine3.24
    container_name: nginx_proxy
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./certs:/etc/nginx/certs:ro,Z
    depends_on:
      - app
    networks:
      - united_house_net

volumes:
  pgdata:

networks:
  united_house_net:
